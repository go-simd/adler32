name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # Native amd64 (AVX2 + SSE, dispatch + Force kernels) and native arm64
  # (the stable toolchain has no go1.27 NEON, so it runs the generic scalar
  # fallback). The gate enforces 100% Go-statement coverage on each.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: go vet ./...
      - run: go test -v ./...
      - run: go test -run '^$' -fuzz FuzzChecksum -fuzztime 20s ./...
      - name: coverage gate (100%)
        run: |
          go test -covermode=atomic -coverprofile=cov.out ./...
          pct=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }

  # The arm64 NEON kernel uses the integer VMUL/VUMULL the Go assembler only
  # gained in Go 1.27, so it builds under //go:build go1.27. Exercise it on the
  # gotip (1.27-devel) toolchain on native arm64, and gate it at 100% — this is
  # the only job that compiles and covers adler32_arm64.go / .s.
  test-arm64-go1_27:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: go install golang.org/dl/gotip@latest && gotip download
      - run: gotip version
      - run: gotip test -v ./...
      - run: gotip test -run '^$' -fuzz FuzzChecksum -fuzztime 20s ./...
      - name: coverage gate (100%, NEON)
        run: |
          gotip test -covermode=atomic -coverprofile=cov.out ./...
          pct=$(gotip tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }

  # riscv64 RVV kernel, run under QEMU user emulation with the V extension on.
  # The riscv64 Force test toggles hasV to also cover the no-V scalar fallback,
  # so a single QEMU run reaches 100% (adler32_riscv64.go / .s + updateChunk).
  test-riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: docker run --privileged --rm tonistiigi/binfmt --install riscv64
      - name: build riscv64 cover binary
        run: GOOS=linux GOARCH=riscv64 go test -covermode=atomic -coverpkg=./... -c -o /tmp/cov.test .
      - name: run under QEMU (RVV) and gate (100%)
        run: |
          docker run --rm --platform linux/riscv64 \
            -e QEMU_CPU=rv64,v=true,vlen=128 \
            -v /tmp:/t debian:trixie \
            /t/cov.test -test.v -test.coverprofile=/t/cov.out
          go tool cover -func=/tmp/cov.out
          pct=$(go tool cover -func=/tmp/cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }

  # ppc64le VSX/AltiVec kernel, run under QEMU user emulation on the power9 CPU
  # model. The ppc64le Force test toggles hasVSX to also cover the no-SIMD scalar
  # fallback, so a single QEMU run reaches 100% (adler32_ppc64le.go / .s +
  # updateChunk's scalar tail). QEMU_CPU=power9 matches go-simd/matchlen's GREEN
  # emulated job.
  test-ppc64le:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: docker run --privileged --rm tonistiigi/binfmt --install ppc64le
      - name: build ppc64le cover binary
        run: GOOS=linux GOARCH=ppc64le go test -covermode=atomic -coverpkg=./... -c -o /tmp/cov.test .
      - name: run under QEMU (VSX) and gate (100%)
        run: |
          docker run --rm --platform linux/ppc64le \
            -e QEMU_CPU=power9 \
            -v /tmp:/t debian:trixie \
            /t/cov.test -test.v -test.coverprofile=/t/cov.out
          go tool cover -func=/tmp/cov.out
          pct=$(go tool cover -func=/tmp/cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }

  # s390x vector-facility kernel (BIG-ENDIAN), run under QEMU user emulation on
  # the default CPU model (which has the vector facility). The s390x Force test
  # toggles hasVX to also cover the scalar fallback, so a single QEMU run reaches
  # 100% (adler32_s390x.go / .s + updateChunk's scalar tail). QEMU_CPU=qemu
  # matches go-simd/matchlen's GREEN emulated job (NOT z14).
  test-s390x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: docker run --privileged --rm tonistiigi/binfmt --install s390x
      - name: build s390x cover binary
        run: GOOS=linux GOARCH=s390x go test -covermode=atomic -coverpkg=./... -c -o /tmp/cov.test .
      - name: run under QEMU (vector facility) and gate (100%)
        run: |
          docker run --rm --platform linux/s390x \
            -e QEMU_CPU=qemu \
            -v /tmp:/t debian:trixie \
            /t/cov.test -test.v -test.coverprofile=/t/cov.out
          go tool cover -func=/tmp/cov.out
          pct=$(go tool cover -func=/tmp/cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }

  # loong64 has no SIMD kernel here, so it exercises the portable generic
  # fallback (adler32_generic.go). Run it under QEMU and gate at 100% so no
  # generic-only statement is left unmeasured.
  test-loong64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: docker run --privileged --rm tonistiigi/binfmt --install loong64
      - name: build loong64 cover binary
        run: GOOS=linux GOARCH=loong64 go test -covermode=atomic -coverpkg=./... -c -o /tmp/cov.test .
      - name: run under QEMU (la464) and gate (100%)
        run: |
          docker run --rm --platform linux/loong64 \
            -e QEMU_CPU=la464 \
            -v /tmp:/t ghcr.io/loong64/debian:trixie \
            /t/cov.test -test.v -test.coverprofile=/t/cov.out
          go tool cover -func=/tmp/cov.out
          pct=$(go tool cover -func=/tmp/cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }
